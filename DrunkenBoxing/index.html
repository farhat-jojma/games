  <!-- 🚫 Anti-ads patch (blocks GameMonetize SDK safely) -->
  <script>
    // Intercept script creation and block any gamemonetize scripts
    const origCreate = document.createElement;
    document.createElement = function (tag, ...args) {
      const el = origCreate.call(this, tag, ...args);
      if (tag.toLowerCase() === "script") {
        const origSet = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, "src").set;
        Object.defineProperty(el, "src", {
          set(value) {
            if (value && value.includes("gamemonetize.com")) {
              console.warn("🧱 Blocked GameMonetize ads:", value);
              return; // Do not load it
            }
            origSet.call(this, value);
          }
        });
      }
      return el;
    };

    // Optional: mock ad functions so the game never crashes
    window.sdk = {
      showBanner: () => console.log("🚫 Ads disabled"),
      showAd: () => console.log("🚫 Ads disabled"),
      showRewarded: () => console.log("🚫 Ads disabled")
    };
    window.adsGameCon = {
      showAd: () => Promise.resolve(),
      resumeGame: () => {},
      pauseGame: () => {},
      showRewarded: () => Promise.resolve()
    };
  </script>
