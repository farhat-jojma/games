<style>

<body style="margin: 0;">
    <!--https://www.youtube.com/watch?v=m4sioSqlXhQ-->
    <div id="page">
        <div id="toolbar">
            <div id="toolbar">
                <!-- Other tool options... -->
                <!-- <div id="save" class="drawTool">
                    Save
                </div> -->
                <div id="download" class="drawTool">
                    Download
                </div>
                <!-- Other tool options... -->
            </div>

            <div class="tooloption" id="rad">
                Radius
                <span id="radval">10</span>
                <div id="decrad" class="radcontrol">-</div>
                <div id="incrad" class="radcontrol">+</div>
            </div>
            <div class="tooloption" id="colors">
            </div>
            <div id="clearCanvas" class="drawTool">
                Clear
            </div>
            <div id="undo" class="drawTool">
                Undo
            </div>
            <div id="restore" class="drawTool">
                Redo
            </div>
            <!--	<a href="save" id="save" class="drawTool">
            Save
        </a>-->
            <div id="eraser" class="drawTool">
                <i class="fas fa-eraser"></i>
            </div>
            <div id="filldrip" class="drawTool">
                <i class="fa fa-fill-drip"></i>
            </div>
            <div id="brush" class="drawTool">
                <i class="fa fa-brush"></i>
            </div>
            <div class="clear"></div>
        </div>
        <div id="canvasWrapper">
            <canvas id="myCanvas">
				Sorry, your browser does not support HTML5 canvas
			</canvas>
        </div>

    </div>

    <script type="text/javascript">
        function onReady(callback) {
            var intervalID = window.setInterval(checkReady, 1000);

            function checkReady() {
                if (document.getElementsByTagName('body')[0] !== undefined) {
                    window.clearInterval(intervalID);
                    callback.call(this);
                }
            }
        }

        function show(id, value) {
            document.getElementById(id).style.display = value ? 'block' : 'none';
        }

        onReady(function() {
            show('page', true);
            show('loading', false);
        });

        document.getElementById('save').addEventListener('click', saveCanvas);
        document.getElementById('download').addEventListener('click', downloadCanvas);


        function saveCanvas() {
            // Get the canvas element
            var canvas = document.getElementById('myCanvas');

            // Convert the canvas content to a data URL
            var dataURL = canvas.toDataURL('image/png');

            // Open a new window with the data URL
            window.open(dataURL, '_blank');
        }

        function downloadCanvas() {
            // Get the canvas element
            var canvas = document.getElementById('myCanvas');

            // Convert the canvas content to a data URL
            var dataURL = canvas.toDataURL('image/png');

            // Create a temporary link element
            var link = document.createElement('a');

            // Set the href attribute to the data URL
            link.href = dataURL;

            // Set the download attribute with a desired filename
            link.download = 'drawing.png';

            // Append the link to the body
            document.body.appendChild(link);

            // Trigger a click event to start the download
            link.click();

            // Remove the link from the body
            document.body.removeChild(link);
        }
    </script>
